  date: '2026-08-21'
  date_label: August 21, 2026
  kind: changed
  title: Asheville posts the Flock termination resolution for a full council vote
  full: The Flock resolution is New Business item VI.A for August 25, not consent. Its seven sections direct the manager to terminate and "immediately request that Flock remove their hardware," bar city employees from searching the city's Flock data, keep existing data "in accordance with applicable law," bar linking it to facial recognition, order a ten-item policy review with "an independent civil-liberties policy reviewer," and freeze new Flock agreements during the review. Axon is not mentioned. ([resolution](https://docs.google.com/document/d/1uhGDUZtpecu4I31Y2ePjYNk1AcM4BPXVP7TbSrRbs40/edit) · [agenda](https://docs.google.com/document/d/1KQx06L9DUN1ReoOSCPcS_fwl8cJ1YlypJJjihwGwFWc/edit) · [[Getting Flock Out|the scorecard]])
