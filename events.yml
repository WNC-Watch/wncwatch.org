  date: '2026-08-25'
  date_label: August 25, 2026
  kind: changed
  title: Asheville council votes 5 to 2 to end the Flock contract
  same_as: 2026-08-25-asheville
  full: '[[Kim Roney|Roney]] moves, [[Sage Turner|Turner]] seconds; [[Antanette Mosley|Mosley]] and [[Sheneika Smith|Smith]] vote no. More than two dozen residents speak, nearly all for termination and nearly all asking council to go further. On the dais, [[Esther Manheimer|the mayor]] confirms the city''s existing Axon contract already covers stationary plate readers, none installed, and City Manager [[D.K. Wesley]] gives a verbal assurance none go up "until that community conversation happens." Minutes after passage, Roney''s moratorium on purchasing new plate readers during the city''s own review **fails for lack of a second**. Full write-up: [[2026-08-25 City Council]].'
