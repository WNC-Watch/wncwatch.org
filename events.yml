  kind: changed
  title: Boone police cut Flock data sharing from over 1,000 agencies to 41
  summary: ' Boone PD''s sharing list, over 1,000 agencies before the May resolution, is down to <strong>41</strong>. (<a href="https://www.wataugademocrat.com/news/local/app-states-flock-cameras-searched-1-5-million-times-over-three-months-before-university-cut/article_53696e9a-39e2-49cf-ba6a-c2e04e367f64.html">Watauga Democrat, Aug 26</a>)'
- id: 2022-06-asheville
  page: WNC/Asheville/Timeline
  order: 2
  area:
  - Buncombe County
  date: 2022-06
  date_label: June 2022
  kind: reported
  title: Citizen Times reports the Buncombe sheriff runs about 2,000 Fusus cameras
  full: The Citizen Times reports that [[Quentin Miller|Sheriff Quentin Miller]]'s office is running roughly 2,000 cameras on the Fusus platform (about 1,500 inside county schools, another 500 across housing communities and businesses) feeding a real-time intelligence center most residents had never heard of. The Sheriff proposes expanding downtown along the courthouse corridor and Patton Avenue, with businesses paying $60 per camera per year to join. ([Citizen Times via Yahoo](https://www.yahoo.com/news/2-000-camera-network-feeding-090126108.html))
- id: 2023-01-24-asheville-2
  page: WNC/Asheville/Timeline
  order: 3
  area:
  - Asheville
  date: '2023-01-24'
  date_label: January 24, 2023
  kind: built
  title: Asheville council votes 4 to 1 to join the county's Fusus camera network
  same_as: 2023-01-24-asheville
  full: City Council approves an interlocal agreement giving APD access to the county's Fusus center (roughly 1,800 cameras at the time) for $30,000 a year, plus city cameras at City Hall, Pritchard Park, and North Lexington. **[[Kim Roney]] casts the only no vote**. ([WLOS](https://wlos.com/news/local/asheville-police-get-access-to-buncombe-county-sheriffs-office-fusus-real-time-intelligence-center-camera-system-collaboration-emergency-situations), [Mountain Xpress](https://mountainx.com/news/asheville-joins-buncombe-county-surveillance-system/))
- id: 2023-03-22-asheville
  page: WNC/Asheville/Timeline
  order: 4
  area:
  - Buncombe County
  date: '2023-03-22'
  date_label: March 22, 2023
  kind: built
  title: Buncombe sheriff's plate-reader policy takes effect
  full: '[[WNC/Buncombe County/index|Policy 402]] allows sharing with any "criminal justice agency" for "active criminal intelligence operations," puts "gang and terrorist watch lists" and "authorized Buncombe County Sheriff''s Office intelligence projects" on the hot list, and assigns the annual audit to the Fusus coordinator "along with sworn members of the FUSUS Advisory Committee." The policy sets no limit on federal sharing and requires no public report. ([BCSO Policy 402](https://public.powerdms.com/Buncombe/documents/2766289))'
- id: 2023-04-asheville
  page: WNC/Asheville/Timeline
  order: 5
  area:
  - Buncombe County
  date: 2023-04
  date_label: April 2023
  kind: built
  title: Buncombe sheriff's plan uses Fusus cameras to monitor downtown Asheville
  full: A sheriff's plan obtained by Asheville Watchdog has deputies using the Fusus network to "monitor downtown business district" and "advise assigned personnel of any suspicious or criminal activity observed during monitoring"; the idea came from commission Chair Brownie Newman, who had questioned the program ten months earlier. ([Asheville Watchdog](https://avlwatchdog.org/down-town-document-reveals-details-of-buncombe-plan-to-assist-asheville-police/))
- id: 2023-09-asheville
  page: WNC/Asheville/Timeline
  order: 6
  area:
  - Buncombe County
  date: 2023-09
  date_label: September 2023
  kind: built
  title: Buncombe sheriff signs a $2.4 million Axon body and dash camera contract
  full: Five years of body cameras and dash cameras that stream live into Fusus; "whenever our deputies are in the vicinity of APD officers, the system makes all the cameras come on," per [[Quentin Miller|Sheriff Miller]]. The same report counts fewer than 15 private downtown businesses on the network sold to commissioners as a revenue opportunity. ([Citizen Times via Yahoo](https://www.yahoo.com/news/buncombe-county-sheriff-gets-real-090507063.html)) [[WNC/Buncombe County/index|Buncombe County]]
- id: 2024-asheville-2
  page: WNC/Asheville/Timeline
  order: 8
  area:
  - Asheville
  date: '2024'
  date_label: '2024'
  kind: built
  title: Congressman signs the federal earmark request for Asheville's intelligence center
  same_as: 2024-asheville
  full: In April 2024, APD and the office of U.S. Rep. [[Chuck Edwards]] (R-NC-11) connect over a federal earmark for a [[What Is the RTIC|Real-Time Intelligence Center]]; accounts differ on who initiated the contact ([[Chuck Edwards|his page]] documents both versions). Edwards signs the formal request letter on **May 22, 2024**; his entire written justification is one sentence. Council is not informed. The sequence became public through the work of [Communities Against Mass Surveillance](https://camsavl.org/rtic-funding-vote/).
- id: 2024-asheville-3
  page: WNC/Asheville/Timeline
  order: 9
  area:
  - Asheville
  date: '2024'
  date_label: 2024 to 2025
  kind: built
  title: Asheville police put Axon in-car plate readers, then Flock cameras, into use
  full: 'Chief Stepp''s August 14, 2026 memo to council dates it this way: Axon in-car plate readers on marked patrol cars "since April 2024," and "in February 2025, APD added the Flock ALPR system" ([memo](https://docs.google.com/document/d/13kwmbwt6T9PiEjUgrFNb9ZHFGzaIsHi5cvsBHkpq-lY/edit)); BPR likewise reports APD "has contracted with Flock since 2025" ([BPR, Aug 21, 2026](https://www.bpr.org/politics-government/2026-08-21/asheville-considers-early-termination-of-flock-but-leaves-door-open-for-other-license-plate-readers)). Earlier coverage, and this site until August 23, put the 11 Flock cameras at April 2024. The Flock contract the city posted in August 2026 (City of Asheville Contract 92500339, through the reseller Insight Public Sector) runs from Feb 1, 2025 to Jan 31, 2027. Between 2024 and December 2025 the readers scan roughly **3.1 million plates**, in a city of about 95,000 people, with data shared with agencies across a **500-mile, multi-state radius**. APD also runs Axon in-car plate readers and roughly two dozen drones. ([Asheville Watchdog](https://avlwatchdog.org/opinion-youre-on-camera-whether-you-like-it-or-not-but-asheville-needs-to-be-more-transparent-about-video-surveillance-proposal/), [Annie Dance / Cops & Congress](https://anniedance.substack.com/p/asheville-expands-regional-surveillance))'
- id: 2025-03-07-asheville-2
  page: WNC/Asheville/Timeline
  order: 10
  area:
  - Asheville
  date: '2025-03-07'
  date_label: March 7, 2025
  kind: changed
  title: Asheville police brief the city council on plate readers for the first time
  same_as: 2025-03-07-asheville
  full: 'Deputy Chief [[Jackie Stepp]] briefs council on the LPR program for the first time, stating that mobile readers had run for nearly a year, stationary readers "approximately two years," cross-jurisdiction sharing was live, and APD had access to **"over 177,000 cameras across the Eastern US"** through Flock and Axon partnerships, "and we''ve had that access." Roney requested the briefing after reading about the cameras online; the committee that would normally review the program was not meeting. Full write-up with timestamps: [[2025-03-07 Agenda Briefing]].'
- id: 2025-03-25-asheville-2
  page: WNC/Asheville/Timeline
  order: 11
  area:
  - Asheville
  date: '2025-03-25'
  date_label: March 25, 2025
  kind: built
  title: Asheville council approves the first intelligence center grant, $71,999, 6 to 1
  same_as: 2025-03-25-asheville
  full: 'A $71,999 federal grant for RTIC equipment (video wall, workstations) is placed on the consent agenda, the part of the meeting reserved for routine, undebated items. Roney pulls it for discussion and submits **29 written questions** to APD about data access, control, and constitutional implications. The questions go unanswered. It passes 6 to 1, along with six other police funding items. Council member [[Sheneika Smith]] says on the record "I kind of feel robbed of having those conversations," and suggests a community forum; it is never held. [[Bo Hess]] speaks for the item: "we''re not buying surveillance, we''re buying chairs", and says the center "already exists." Full write-up: [[2025-03-25 City Council]]. ([BPR](https://www.bpr.org/bpr-news/2025-03-26/last-night-at-council-asheville-approves-funding-for-police-surveillance-hub), [CAMS](https://camsavl.org/rtic-funding-vote/))'
- id: 2025-04-09-asheville
  page: WNC/Asheville/Timeline
  order: 12
  area:
  - Buncombe County
  date: '2025-04-09'
  date_label: April 9, 2025
  kind: built
  title: Buncombe sheriff approves a written policy for the intelligence center
  full: '[[Quentin Miller|Sheriff Miller]] approves [[WNC/Buncombe County/index|Policy 217]]: "proactive monitoring," cameras near public events "to look for suspicious activity leading up to and during the event," rapid-deployment cameras, and a sharing clause APD would later copy verbatim into its own Policy 1703. ([BCSO Policy 217](https://public.powerdms.com/Buncombe/documents/3407385))'
- id: 2026-02-asheville-2
  page: WNC/Asheville/Timeline
  order: 13
  area:
  - Asheville
  date: 2026-02
  date_label: February 2026
  kind: built
  title: The $1.14 million federal earmark for Asheville's intelligence center arrives
  same_as: 2026-02-asheville
  full: 'The Community Project Funding earmark secured by Rep. [[Chuck Edwards]] comes through: $1.14 million, administered by the Department of Justice. The DOJ''s conditions are published only after acceptance. ([CAMS](https://camsavl.org/rtic-funding-vote/))'
- id: 2026-04-11-asheville
  page: WNC/Asheville/Timeline
  order: 15
  area:
  - Asheville
  date: '2026-04-11'
  date_label: April 11, 2026
  kind: changed
  title: Asheville residents' group holds a public teach-in on the intelligence center
  full: 'Three days before the council vote, [[Get Involved|SASSI]] (Southerners Against Surveillance Systems & Infrastructure) holds "You Are Being Watched: An Introduction to Police Surveillance in Buncombe County" at Firestorm Books. ([SASSI](https://sassisouth.org))'
- id: 2026-04-14-asheville-2
  page: WNC/Asheville/Timeline
  order: 16
  area:
  - Asheville
  date: '2026-04-14'
  date_label: April 14, 2026
  kind: changed
  title: Asheville council pulls the intelligence center item from the consent agenda
  same_as: 2026-04-14-asheville
  full: 'More than 40 residents arrive to speak against accepting the $1.14M. The item is pulled from the agenda right before the meeting. A resident, speaking at public comment: "Let''s call it what it actually is: a centralized hub for spying on the people of Asheville." [[Esther Manheimer|Mayor Manheimer]] says the issue "warrants a full conversation." ([BPR](https://www.bpr.org/politics-government/2026-04-15/asheville-city-council-punts-vote-on-police-tech-funding-and-suggests-property-tax-hike))'
- id: 2026-04-27-asheville
  page: WNC/Asheville/Timeline
  order: 17
  area:
  - Asheville
  date: '2026-04-27'
  date_label: April 27, 2026
  kind: reported
  title: Asheville Watchdog column criticizes the city's handling of the intelligence center
  full: 'Asheville Watchdog''s John Boyle publishes an opinion piece criticizing the city for burying the initiative on consent agendas and demanding transparency. The cost breakdown he reports: ~$400K video wall, $467K in software over 7–8 years, $250K operational. ([Asheville Watchdog](https://avlwatchdog.org/opinion-youre-on-camera-whether-you-like-it-or-not-but-asheville-needs-to-be-more-transparent-about-video-surveillance-proposal/))'
- id: 2026-04-28-asheville-2
  page: WNC/Asheville/Timeline
  order: 18
  area:
  - Asheville
  date: '2026-04-28'
  date_label: '[[2026-04-28 Work Session|April 28, 2026]]'
  kind: built
  title: Axon and Flock present to an Asheville council work session
  same_as: 2026-04-28-asheville
  full: The Policy, Finance and Infrastructure Committee hears presentations from Axon and Flock sales representatives alongside Interim Chief [[Jackie Stepp]]. No public comment is allowed. CAMS members publish a [fact-check one-pager](https://www.sunshinelabs.org/wp-content/uploads/2026/05/Asheville-RTIC-%E2%80%93-1-Pager.pdf) responding to vendor claims. ([CAMS](https://camsavl.org/rtic-funding-vote/))
- id: 2026-05-11-asheville
  page: WNC/Asheville/Timeline
  order: 19
  area:
  - Asheville
  date: '2026-05-11'
  date_label: May 11, 2026
  kind: reported
  title: Asheville group urges council to reject the intelligence center and Axon contract
  full: 'The Government Accountability Project of Asheville publishes its position: reject the RTIC/Axon expansion until real oversight exists: no civilian oversight body, no facial recognition ban, vendor lock-in, and no final negotiated contract available for council to review. ([GAP](https://gapavl.org/asheville-should-reject-the-proposed-rtic-axon-surveillance-expansion-until-real-oversight-and-accountability-exist/))'
- id: 2026-05-12-asheville-2
  page: WNC/Asheville/Timeline
  order: 20
  area:
  - Asheville
  date: '2026-05-12'
  date_label: May 12, 2026
  kind: built
  title: Asheville council approves the intelligence center grant and Axon contract, 6 to 1
  same_as: 2026-05-12-asheville
  full: The RTIC items are placed at the end of a budget meeting. Public comment is capped at one hour; **21 residents who had signed up do not get to speak.** Of the 23 who speak, 22 oppose. The council approves the $1.14M grant and a **7.5-year contract with Axon** (body cameras, tasers, drones, interview-room tech, and Fusus software) without the final contract text available for review. [[Kim Roney|Roney]], the only no, presents ACLU and EFF concerns. Residents chant "Shame!" as it passes. Council member [[Bo Hess]] attaches a resolution stating the tech will be used "solely for lawful purposes." ([BPR](https://www.bpr.org/politics-government/2026-05-13/asheville-council-accepts-police-tech-funding-hears-budget-proposal), [828NewsNow](https://828newsnow.com/news/228822-asheville-oks-real-time-police-intelligence-center-despite-public-backlash/), [Enlace Latino NC](https://enlacelatinonc.org/en/Asheville-City-Council-approves-creation-of-real-time-intelligence-center/), [People's World](https://www.peoplesworld.org/article/surveillance-state-major-police-intelligence-center-coming-to-asheville-n-c/))
- id: 2026-05-13-asheville
  page: WNC/Asheville/Timeline
  order: 22
  area:
  - Buncombe County
  date: '2026-05-13'
  date_label: May 13, 2026
  kind: changed
  title: Buncombe County releases 28 months of the sheriff's Fusus camera access log
  full: 'One day after an anonymous public records request, Buncombe County produces 28 months of the Sheriff''s Office''s Fusus access log, 337,838 entries, and withholds eight columns including every timestamp under G.S. 132-1.4 ([MuckRock](https://www.muckrock.com/foi/buncombe-county-4590/public-records-request-fusus-logs-211165/)). The released columns show 58 percent of camera viewing on public housing and 95 to 99 percent of it live. Analyzed August 2026: [[Sheriffs Audit Log|Buncombe County Sheriff''s Office Fusus access log, 2024 to 2026]].'
- id: 2026-05-25-asheville
  page: WNC/Asheville/Timeline
  order: 23
  area:
  - Asheville
  date: '2026-05-25'
  date_label: May 25, 2026
  kind: changed
  title: Asheville residents' group holds a surveillance-awareness event
  full: 'CAMS throws a surveillance-awareness social at DayTrip: DJ sets and a Q&A with [[Benn Jordan]] (the researcher whose Flock investigations reached national press) plus Kim Roney, Colonel Panic, and Patrick Conant. ([Sunshine Labs](https://www.sunshinelabs.org/sos-sunshine-over-surveillance/))'
- id: 2026-05-28-asheville
  page: WNC/Asheville/Timeline
  order: 24
  area:
  - Asheville
  date: '2026-05-28'
  date_label: May 28, 2026
  kind: reported
  title: Asheville mayoral candidates split on surveillance at the first debate
  full: At the first Roney–Manheimer debate, surveillance is one of the main disagreements. Roney raises "a billionaire-owned, AI-fueled, for-profit tech company... working with ICE" surveilling without warrants; Manheimer frames the grant as cost savings. ([BPR](https://www.bpr.org/politics-government/2026-05-28/at-the-first-asheville-mayor-debate-roney-and-manheimer-clash-over-transparency-and-surveillance))
- id: 2026-06-04-asheville
  page: WNC/Asheville/Timeline
  order: 26
  area:
  - Asheville
  date: '2026-06-04'
  date_label: June 4, 2026
  kind: built
  title: Asheville police open public tours of the intelligence center
  full: APD opens bi-weekly public tours of the RTIC space, framed as transparency "following public debates over privacy." Every other Thursday, 2–4 PM; register at 828-259-5881. ([WLOS](https://wlos.com/news/local/asheville-police-department-tours-new-real-time-intelligence-center-approved-federal-funds-social-media-transparency-privacy-public-debates-analyze-data-emergencies-register))
- id: 2026-06-11-asheville
  page: WNC/Asheville/Timeline
  order: 27
  area:
  - Asheville
  date: '2026-06-11'
  date_label: June 11 – July 23, 2026
  kind: built
  title: Asheville police convene an unannounced workgroup to write the intelligence center policy
  full: 'Interim Chief [[Jackie Stepp|Stepp]] convenes a four-session "RTIC Stakeholder Policy Workgroup" (APD staff, Sheriff [[Quentin Miller|Miller]], and invited community members; none of the groups that opposed the RTIC were invited) to shape Policy 1703, the center''s governing policy. The sessions were not announced; the meeting notes surface only through an August records request. What they show, including the stated goal of a "regional RTIC," a coming city-county MOU, and the messaging strategy ("community partnership rather than a surveillance initiative"): [[The RTIC Policy]].'
- id: 2026-07-07-asheville
  page: WNC/Asheville/Timeline
  order: 28
  area:
  - Raleigh and Washington
  date: '2026-07-07'
  date_label: July 7, 2026
  kind: built
  title: NC budget makes the state's highway plate-reader program permanent
  full: 'The NC budget makes the SBI''s highway license plate reader program permanent, authorizing ALPRs on state-maintained roads. The SBI''s stated goal: a camera at every entrance and exit to the state. ([WRAL](https://www.wral.com/news/nccapitol/surveillance-drivers-camera-alpr-license-plate-reader-nc-budget-public-safety-privacy-july-2026/), [Daily Tar Heel](https://dailytarheel.com/article/city-ai-highway-surveillance-north-carolina-budget-20260728))'
- id: 2026-07-08-asheville
  page: WNC/Asheville/Timeline
  order: 29
  area:
  - Asheville
  date: '2026-07-08'
  date_label: July 8, 2026
  kind: reported
  title: WLOS reports Asheville's intelligence center plans camera and drone links
  full: 'A WLOS investigation details the RTIC''s planned integrations (Flock ALPRs, body and car cameras, drones, voluntary private cameras in Fusus''s "one pane of glass") and APD''s internal controls: quarterly audits, keycard reviews, and search-term blocks. APD tech manager James Wingo: blocks cover "anything to do with immigration, anything to do with reproductive issues." The controls are administered by APD itself. Operational target: **spring/summer 2027**. ([WLOS](https://wlos.com/news/news-13-investigates/inside-asheville-police-department-apd-future-real-time-intelligence-center-cameras-license-plate-readers-car-body-cams-drones-technology-investigations))'
- id: 2026-07-14-asheville
  page: WNC/Asheville/Timeline
  order: 30
  area:
  - Macon County
  date: '2026-07-14'
  date_label: July 14, 2026
  kind: changed
  title: Macon commissioners vote 5 to 0 to end the county's Flock contract
  full: County commissioners vote **5 to 0** to end their $47,000 Flock contract; 12 cameras come down. The push came largely from Republican residents and officials. See [[Western North Carolina and the State|Western North Carolina and the state]]. ([Smoky Mountain News](https://smokymountainnews.com/news/news-latest/de-flocking-macon-county-votes-to-let-alpr-contract-lapse/))
  record: Meetings/Macon County/2026-07-14 Commissioners
- id: 2026-07-16-asheville-2
  page: WNC/Asheville/Timeline
  order: 31
  area:
  - Asheville
  date: '2026-07-16'
  date_label: July 16, 2026
  kind: built
  title: Asheville sends the Axon contract to Axon for signature
  same_as: 2026-07-16-asheville
  full: City emails released Aug 20 show the contract sent to Axon nine weeks after the vote, a second contract for 20 Axon Fleet in-car plate readers in "final signature stage," and the city attorney's office asking Axon, by email, to opt the city out of its default data program. ([[The RTIC Policy]])
- id: 2026-07-29-asheville
  page: WNC/Asheville/Timeline
  order: 32
  area:
  - region
  date: '2026-07-29'
  date_label: July 29 & August 5, 2026
  kind: reported
  title: Two NC police officers charged over misuse of Flock searches
  full: 'A Charlotte officer becomes the first in NC criminally charged for an unauthorized Flock search; a week later a Mooresville officer is arrested for using Flock to stalk his ex-wife: 31 searches. ([WNC/state coverage via NCLocal](https://nclocal.org/2026/07/30/balancing-public-safety-and-privacy-wnc-wrestles-with-surveillance-issues/))'
- id: 2026-08-04-asheville-2
  page: WNC/Asheville/Timeline
  order: 33
  area:
  - Asheville
  date: '2026-08-04'
  date_label: August 4, 2026
  kind: built
  title: Asheville city manager signs the $7.4 million Axon contract
  same_as: 2026-08-04-asheville
  full: 'City of Asheville Contract 92700065, dated Aug 1: $7,423,161.15 through Dec 31, 2033, of which $6,955,559 is city money and $467,602.15 the grant-funded Fusus subscription. Interim Chief [[Jackie Stepp|Stepp]] signed July 27. ([[The Axon Contract as Signed|The contract, as signed]] · [[The Grant and the Contract|the grant and the contract]])'
- id: 2026-08-07-asheville
  page: WNC/Asheville/Timeline
  order: 34
  area:
  - Asheville
  date: '2026-08-07'
  date_label: August 7, 2026
  kind: none
  title: Asheville Flock camera near Carrier Park is found vandalized
  full: A Flock camera near Carrier Park is found vandalized. ([WLOS](https://wlos.com/news/local/gallery/asheville-flock-camera-vandalized-carrier-park-license-plate-reader-damaged))
- id: 2026-08-14-asheville-2
  page: WNC/Asheville/Timeline
  order: 35
  area:
  - Asheville
  date: '2026-08-14'
  date_label: August 14, 2026
  kind: built
  title: Asheville interim chief tells council Axon plate readers are planned by February 2027
  same_as: 2026-08-14-asheville
  full: '[[Jackie Stepp]] writes council that APD "is not pursuing a full transition away from Flock" but is "exploring transitioning... to a Flock software license that would preserve access to the Flock network," while "expanding and integrating Axon''s automated license plate reader capabilities," with "the Axon ALPR infrastructure operational" by February 2027. The memo counts 86 Flock cameras in Buncombe County, 11 of them the city''s, says the sheriff "currently uses Flock ALPR cameras," and describes evaluating "consolidating the BCSO RTIC into the APD RTIC." It becomes public as an agenda attachment a week later. The same week the city launches its Technology and Public Safety page with the signed contract; the page''s plate-reader answers describe the Flock program ([[The Technology and Public Safety Page|the city''s page, annotated]]). ([memo](https://docs.google.com/document/d/13kwmbwt6T9PiEjUgrFNb9ZHFGzaIsHi5cvsBHkpq-lY/edit) · [[Getting Flock Out|scored against the eight demands]])'
- id: 2026-08-16-asheville
  page: WNC/Asheville/Timeline
  order: 36
  area:
  - region
  date: '2026-08-16'
  date_label: August 16–22, 2026
  kind: changed
  title: Asheville groups join the national Week of Action against plate readers
  full: 'Asheville joins the DeFlock National Week of Action Against ALPRs: a West Asheville kickoff potluck, an online panel, and a Friday celebration at Cooperative Coffee. ([CAMS](https://camsavl.org), [DeFlock](https://deflock.org))'
- id: 2026-08-19-asheville
  page: WNC/Asheville/Timeline
  order: 37
  area:
  - Asheville
  date: '2026-08-19'
  date_label: August 19, 2026
  kind: changed
  title: Asheville mayor calls for a vote to end the Flock contract
  full: 'Mid-Week of Action, two days after [[Sage Turner]] documented that the city''s Flock cameras were still up despite her vote''s conditions, [[Esther Manheimer|Mayor Manheimer]] issues a statement calling for a vote at the **August 25** council meeting to authorize city manager [[D.K. Wesley]] to terminate the Flock contract: "I have heard clearly from Asheville residents, and I''m calling on Asheville to turn off the Flock cameras and remove them, which requires terminating the Flock contract." She says a moratorium wouldn''t be enough because "our contract does not allow for the removal of the technology unless we terminate the contract," and asks for a transparent policy on handling and deleting the data already collected. The statement says nothing about APD''s Flock search accounts, the county''s cameras, or the [[What Axon Contracts Do|Axon contract]]; see [[Getting Flock Out]] for what a full exit requires, and note it stays a statement until council votes. That same morning, hours before the announcement, APD had publicized using Flock cameras to identify suspects in a West Asheville paintball assault case. ([WLOS](https://wlos.com/news/local/asheville-mayor-esther-manheimer-vote-end-city-flock-safety-contract-remove-cameras-backlash-automatic-license-plate-readers-data-surveillance) · [828newsnow](https://828newsnow.com/news/228822-asheville-mayor-calls-for-vote-to-terminate-flock-camera-contract/) · [WLOS, paintball](https://wlos.com/news/local/asheville-flock-cameras-paintball-assaults-juvenile-suspects-west-asheville-haywood-road))'
- id: 2026-08-20-asheville
  page: WNC/Asheville/Timeline
  order: 38
  area:
  - Asheville
  date: '2026-08-20'
  date_label: August 20, 2026
  kind: changed
  title: Asheville mayor presents the Flock termination resolution at the agenda briefing
  full: 'At the agenda briefing for the Aug 25 meeting, [[Esther Manheimer|Manheimer]] presents the actual resolution and discloses two facts: **Flock changed its policy to require 10 cameras minimum for system access**, which ends the "keep one camera" plan, and removal requires termination because "the cameras are technically not ours. They''re Flock''s." A staff memo read aloud by [[Kim Roney|Roney]] says the city is "expanding and integrating Axon''s automated license plate reader capabilities" while Flock winds down, and the mayor confirms Axon stationary readers are "in the pipeline." Full write-up: [[2026-08-20 Agenda Briefing]].'
- id: 2026-08-20-asheville-2
  page: WNC/Asheville/Timeline
