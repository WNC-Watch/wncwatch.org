- id: 2022-12-asheville
  page: WNC/Asheville/index
  order: 46
  area:
  - Asheville
  date: 2022-12
  date_label: December 2022
  kind: built
  title: Asheville police sign an agreement for access to the sheriff's Fusus camera network
  summary: ' APD signs an MOU with the <a href="./WNC/Buncombe-County/index">Buncombe County</a> Sheriff''s Office for access to the county''s Fusus platform: "We''ve had limited access since 2022," <a href="../WNC/Asheville/Officials/Jackie-Stepp">Interim Chief Stepp</a> later confirmed (<a href="../Meetings/Asheville/2026-04-28-Work-Session">April 28, 2026 session, 1:01:29</a>). The MOU predates the council vote of January 2023.'
- id: 2023-01-24-asheville
  page: WNC/Asheville/index
  order: 47
  area:
  - Asheville
  date: '2023-01-24'
  date_label: January 24, 2023
  kind: built
  title: Asheville council votes 4 to 1 to join the county's Fusus camera network
  summary: ' The interlocal agreement: APD access to the county''s ~1,800-camera Fusus network, $30,000/year. Housing Authority director David Nash speaks in favor; the ~500 cameras in housing communities come with no resident consent process (<a href="../WNC/Asheville/Tracking/Cameras-in-Public-Housing">Cameras in Public Housing</a>). <strong><a href="../WNC/Asheville/Officials/Kim-Roney">Kim Roney</a> casts the only no vote</strong>. (<a href="https://mountainx.com/news/asheville-joins-buncombe-county-surveillance-system/">Mountain Xpress</a>)'
- id: 2024-04-asheville
  page: WNC/Asheville/index
  order: 48
  area:
  - Asheville
  date: 2024-04
  date_label: April 2024
  kind: built
  title: Asheville police put plate readers on patrol cars without a council briefing
  summary: ' LPRs go live on APD''s fleet vehicles. Council is not briefed; there is no vote. (<a href="../Meetings/Asheville/2025-03-07-Agenda-Briefing">disclosed at the March 7, 2025 briefing</a>)'
- id: 2024-asheville
  page: WNC/Asheville/index
  order: 49
  area:
  - Asheville
  date: '2024'
  date_label: '2024'
  kind: built
  title: Congressman signs the federal earmark request for Asheville's intelligence center
  summary: ' APD and the office of U.S. Rep. <a href="../WNC/Raleigh-and-Washington/Chuck-Edwards">Chuck Edwards</a> arrange a federal RTIC earmark; accounts differ on who initiated it. Edwards signs the request May 22, 2024. Council is not informed. (<a href="../WNC/Raleigh-and-Washington/Chuck-Edwards">Chuck Edwards</a> · <a href="../WNC/Asheville/Timeline">Timeline</a>)'
- id: 2024-09-24-asheville
  page: WNC/Asheville/index
  order: 50
  area:
  - Asheville
  date: '2024-09-24'
  date_label: September 24, 2024
  kind: built
  title: Asheville committee hears a $60,000 grant plan to start the intelligence center
  summary: ' A ~$60K JAG grant "to start the outfit of a real-time intelligence center" gets an informational committee session (no vote), Hurricane Helene strikes three days later; the RTIC does not return to a council agenda until March 2025. (<a href="../Meetings/Asheville/2025-03-25-City-Council">2025-03-25 City Council</a>)'
- id: 2025-02-asheville
  page: WNC/Asheville/index
  order: 51
  area:
  - Asheville
  date: 2025-02
  date_label: February 2025
  kind: built
  title: Asheville police sign a contract for 11 Flock cameras
  summary: ' APD contracts for 11 stationary Flock cameras. (<a href="../Meetings/Asheville/2026-04-28-Work-Session">Stepp''s own timeline, 1:03:04</a>)'
- id: 2025-03-07-asheville
  page: WNC/Asheville/index
  order: 52
  area:
  - Asheville
  date: '2025-03-07'
  date_label: March 7, 2025
  kind: changed
  title: Asheville police brief the city council on plate readers for the first time
  summary: ' First briefing to council, requested by Kim Roney after she read about the cameras in the news: mobile LPRs running ~11 months, stationary cameras in the community "approximately two years," access to "<strong>over 177,000 cameras across the Eastern US</strong>"; "and we''ve had that access." Full write-up: <a href="../Meetings/Asheville/2025-03-07-Agenda-Briefing">2025-03-07 Agenda Briefing</a>.'
- id: 2025-03-25-asheville
  page: WNC/Asheville/index
  order: 53
  area:
  - Asheville
  date: '2025-03-25'
  date_label: March 25, 2025
  kind: built
  title: Asheville council approves the first intelligence center grant, $71,999, 6 to 1
  summary: ' $71,999 on the consent agenda, listed between bulletproof vests and DEA grants. Roney''s 29 written questions were unanswered and her request to delay was declined; <a href="../WNC/Asheville/Officials/Bo-Hess">Hess</a> said "we''re not buying surveillance, we''re buying chairs" and that the center "already exists." Passes 6 to 1. Full write-up: <a href="../Meetings/Asheville/2025-03-25-City-Council">2025-03-25 City Council</a>.'
- id: 2025-07-31-asheville
  page: WNC/Asheville/index
  order: 54
  area:
  - Asheville
  date: '2025-07-31'
  date_label: July 31, 2025
  kind: built
  title: Asheville police tell a council committee their plate readers connect to 19,000 cameras
  summary: ' APD tells the <a href="../WNC/Asheville/Tracking/The-Committee">Public Safety Committee</a> the LPR network is "connected to over 19,000 cameras" (March''s figure: 177,000) and that immigration alerts exist but are "turned off." The committee did not request an audit. (<a href="../WNC/Asheville/Tracking/Police-Oversight-in-Asheville">Police oversight in Asheville, 1991 to 2026</a> · <a href="../WNC/Asheville/Tracking/Asheville-RTIC-Claims-and-the-Record">Asheville''s RTIC claims and the record</a>)'
- id: 2026-02-asheville
  page: WNC/Asheville/index
  order: 55
  area:
  - Asheville
  date: 2026-02
  date_label: February 2026
  kind: built
  title: The $1.14 million federal earmark for Asheville's intelligence center arrives
  summary: ' The Edwards earmark arrives, DOJ-administered, conditions published only after acceptance. (<a href="../WNC/Asheville/Timeline">Timeline</a>)'
- id: 2026-04-14-asheville
  page: WNC/Asheville/index
  order: 56
  area:
  - Asheville
  date: '2026-04-14'
  date_label: April 14, 2026
  kind: changed
  title: Asheville council pulls the intelligence center item from the consent agenda
  summary: ' The RTIC item is pulled from consent "to create some awareness"; residents speak against it for an hour. (<a href="../WNC/Asheville/Tracking/The-People-Who-Showed-Up">The People Who Showed Up</a>)'
- id: 2026-04-28-asheville
  page: WNC/Asheville/index
  order: 57
  area:
  - Asheville
  date: '2026-04-28'
  date_label: April 28, 2026
  kind: built
  title: Axon and Flock present to an Asheville council work session
  summary: ' Axon and Flock representatives present, no public comment taken; the Durham "peer city" example is challenged during the session; Roney reads the Flock contract''s "irrevocable, worldwide license" clause into the record. Full write-up: <a href="../Meetings/Asheville/2026-04-28-Work-Session">2026-04-28 Work Session</a>.'
- id: 2026-05-07-asheville
  page: WNC/Asheville/index
  order: 58
  area:
  - Asheville
  date: '2026-05-07'
  date_label: May 7, 2026
  kind: built
  title: Asheville city manager says the Axon contract before council is not yet written
  summary: ' Five days before the vote, the city manager confirms the Axon contract council will authorize hasn''t been written; the "keep one Flock camera" plan is explained as a network-access subscription. Full write-up: <a href="../Meetings/Asheville/2026-05-07-Agenda-Briefing">2026-05-07 Agenda Briefing</a>.'
- id: 2026-05-12-asheville
  page: WNC/Asheville/index
  order: 59
  area:
  - Asheville
  date: '2026-05-12'
  date_label: May 12, 2026
  kind: built
  title: Asheville council approves the intelligence center grant and Axon contract, 6 to 1
  summary: ' After six hours, 22 of 23 speakers oppose the items; 21 more had signed up and did not speak; the motion was seconded before public comment began. The vote is <strong>6 to 1</strong>, Roney the no. $1.14M accepted, 7.5-year Axon authorization granted. Full write-up: <a href="../Meetings/Asheville/2026-05-12-City-Council">2026-05-12 City Council</a>.'
- id: 2026-07-16-asheville
  page: WNC/Asheville/index
  order: 60
  area:
  - Asheville
  date: '2026-07-16'
  date_label: July 16, 2026
  kind: built
  title: Asheville sends the Axon contract to Axon for signature
  summary: ' City emails released Aug 20 show the contract sent to Axon nine weeks after the vote, a second contract for 20 Axon Fleet in-car plate readers in "final signature stage," and the city attorney''s office opting out of Axon''s default data program by email. (<a href="../WNC/Asheville/Tracking/The-RTIC-Policy">The RTIC Policy</a>)'
- id: 2026-08-04-asheville
  page: WNC/Asheville/index
  order: 61
  area:
  - Asheville
  date: '2026-08-04'
  date_label: August 4, 2026
  kind: built
  title: Asheville city manager signs the $7.4 million Axon contract
  summary: ' City of Asheville Contract 92700065: $7,423,161.15 from Aug 1, 2026 to Dec 31, 2033, $6,955,559 of it city money; the interim chief signed July 27. (<a href="../WNC/Asheville/Tracking/The-Axon-Contract-as-Signed">The Axon contract, as signed</a> · <a href="../WNC/Asheville/Tracking/The-Grant-and-the-Contract">The grant and the contract</a>)'
- id: 2026-08-asheville
  page: WNC/Asheville/index
  order: 62
  area:
  - Asheville
  date: 2026-08
  date_label: August 2026
  kind: reported
  title: 'Asheville police describe their Flock cameras: 11 cameras, 18 authorized searchers'
  summary: ' APD''s explainer interview: 11 cameras, 18 authorized searchers, "you have to put the reason" (Sen. Ron Wyden''s office had described Flock''s reason field as "meaningless"). (<a href="../Briefings/What-They-Can-Actually-Learn-About-You">What a plate read becomes</a> · <a href="https://828newsnow.com/news/228822-flock-cameras-asheville-police-explain-use-of-11-license-plate-readers/">828NewsNow</a>)'
- id: 2026-08-14-asheville
  page: WNC/Asheville/index
  order: 63
  area:
  - Asheville
  date: '2026-08-14'
  date_label: August 14, 2026
  kind: built
  title: Asheville interim chief tells council Axon plate readers are planned by February 2027
  summary: ' Interim Chief Stepp''s memo to council: APD "is not pursuing a full transition away from Flock" and expects "the Axon ALPR infrastructure operational" by February 2027. The city launches its Technology and Public Safety page with the signed contract; its plate-reader answers describe the Flock program. (<a href="../WNC/Asheville/Tracking/The-Technology-and-Public-Safety-Page">The city''s page, annotated</a>)'
- id: 2026-08-25-asheville
  page: WNC/Asheville/index
  order: 64
  area:
  - Asheville
  date: '2026-08-25'
  date_label: August 25, 2026
  kind: changed
  title: Asheville council votes 5 to 2 to end the Flock contract
  summary: ' Roney moves, Turner seconds; Mosley and Smith vote no. Full write-up: <a href="../Meetings/Asheville/2026-08-25-City-Council">2026-08-25 City Council</a>.'
- id: 2026-08-29-asheville
  page: WNC/Asheville/index
  order: 65
  area:
  - Asheville
  date: '2026-08-29'
  date_label: August 29–September 1, 2026
  kind: built
  title: Asheville police drones cover the G20 finance ministerial
  summary: ' Finance ministers, federal security, road closures; Asheville''s cameras remained in Flock''s national network, whose logs elsewhere show searches tagged "protest." APD''s drone unit covered the summit''s temporary flight restriction around the clock and located nine drone pilots inside it, the department told the Public Safety Committee on Sept 24. (<a href="../Briefings/Who-Gets-Watched">Who Gets Watched</a> · <a href="../Meetings/Asheville/2026-09-24-Public-Safety-Committee">2026-09-24 Public Safety Committee</a>)'
- id: 2027-01-31-asheville
  page: WNC/Asheville/index
  order: 66
  area:
  - Asheville
  date: '2027-01-31'
  date_label: January 31, 2027
  kind: ahead
  title: Original end date of Asheville's Flock contract, terminated Aug 25, 2026
  summary: ' The original term of City of Asheville Contract 92500339. Council terminated the contract on Aug 25, 2026; the deletion notice and camera removal are tracked on <a href="../Act/Getting-Flock-Out">Getting Flock Out</a>.'
- id: 2027-asheville
  page: WNC/Asheville/index
  order: 67
  area:
  - Asheville
  date: '2027'
  date_label: Spring/summer 2027
  kind: ahead
  title: Asheville's intelligence center is projected to be fully operational
  summary: ' The oversight commitments made at the vote come due; Promise Tracker lists them. (<a href="../WNC/Asheville/Tracking/Promise-Tracker">Promise Tracker</a>)'
- id: 2033-asheville
  page: WNC/Asheville/index
  order: 68
  area:
  - Asheville
  date: '2033'
  date_label: '2033'
  kind: ahead
  title: Asheville's Axon contract term ends
  summary: ' The renewal terms are on What Axon Contracts Do. (<a href="../Companies/What-Axon-Contracts-Do">What Axon Contracts Do</a>)'
- id: 2021-buncombe-county
  page: WNC/Buncombe County/index
  order: 24
  area:
  - Buncombe County
  date: '2021'
  date_label: Late 2021
  kind: built
  title: Buncombe County Schools join the sheriff's Fusus camera network, about 1,500 cameras
  summary: ' Buncombe County Schools becomes the first WNC district on Fusus via a memorandum of understanding with the Sheriff''s Office: roughly 1,500 cameras across 43 schools, with no public school-board vote on record. The district "has the authority to decide when the sheriff''s office can access video," per the Sheriff''s Office. (<a href="https://wlos.com/news/local/program-gives-buncombe-deputies-access-to-real-time-video-during-school-emergencies">WLOS</a>) <a href="../WNC/Asheville/Tracking/Cameras-in-Public-Housing">Cameras in Public Housing</a>'
- id: 2022-06-07-buncombe-county
  page: WNC/Buncombe County/index
  order: 25
  area:
  - Buncombe County
  date: '2022-06-07'
  date_label: June 7, 2022
  kind: built
  title: Buncombe sheriff pitches the intelligence center to commissioners as self-funding
  summary: ' The Sheriff''s Office presents the Real-Time Intelligence Center to county commissioners as an enterprise fund "without any cost to the tax payers" (<a href="https://media.buncombenc.gov/common/Commissioners/20220607/Pre%20RTIC%20for%20Sheriff%20ppt-final.pdf">the eight-slide deck</a>). Jasmine Beach-Ferrara and then-Chair Brownie Newman push back. Sheriff <a href="../WNC/Buncombe-County/Officials/Quentin-Miller">Quentin Miller</a> to the Citizen Times that week: "We don''t use taxpayer money to fund this, so the challenge is, how do we continue to use the system without there being a cost to the county?" (<a href="https://www.yahoo.com/news/2-000-camera-network-feeding-090126108.html">Citizen Times via Yahoo</a>) <a href="../WNC/Asheville/Timeline">Timeline</a>'
- id: 2022-07-buncombe-county
  page: WNC/Buncombe County/index
  order: 26
  area:
  - Buncombe County
  date: 2022-07
  date_label: July 2022
  kind: built
  title: Buncombe commissioners approve $130,000 for the sheriff's intelligence center
  summary: ' Reported by the Citizen Times (<a href="https://www.yahoo.com/news/2-000-camera-network-feeding-090126108.html">Citizen Times via Yahoo</a>) and WLOS (<a href="https://wlos.com/news/local/buncombe-county-sheriffs-office-real-time-intelligence-center-investigations-commissioners">WLOS</a>).'
- id: 2022-buncombe-county
  page: WNC/Buncombe County/index
  order: 27
  area:
  - Buncombe County
  date: '2022'
  date_label: '2022'
  kind: built
  title: Black Mountain town board approves 5 Flock plate-reader cameras
  summary: ' The county''s one municipal deployment with published results. <a href="../Act/Getting-Flock-Out">Getting Flock Out</a>'
- id: 2023-01-24-buncombe-county
  page: WNC/Buncombe County/index
  order: 28
  area:
  - Buncombe County
  date: '2023-01-24'
  date_label: January 24, 2023
  kind: built
  title: Asheville council votes 4 to 1 to join the county's Fusus camera network
  same_as: 2023-01-24-asheville
  summary: ' City Council approves a $30,000-a-year interlocal agreement for APD access to the county center, "subject to the sheriff''s policies in terms of use." <a href="../WNC/Asheville/Officials/Kim-Roney">Kim Roney</a> is the only no; <a href="../WNC/Asheville/Officials/Sage-Turner">Sage Turner</a> and <a href="../WNC/Asheville/Officials/Sheneika-Smith">Sheneika Smith</a> are absent. The MOU itself had been signed in December 2022, before the vote. (<a href="https://www.yahoo.com/news/buncombe-county-sheriff-1-800-100909984.html">Citizen Times via Yahoo</a>) Why the order matters: <a href="./Briefings/What-the-Law-Lets-the-County-Do">What the Law Lets the County Do</a>.'
- id: 2023-03-22-buncombe-county
  page: WNC/Buncombe County/index
  order: 29
  area:
  - Buncombe County
  date: '2023-03-22'
  date_label: March 22, 2023
  kind: built
  title: Buncombe sheriff's plate-reader policy takes effect
  same_as: 2023-03-22-asheville
  summary: ' (Policy 402, below). It allows sharing with any "criminal justice agency" for "active criminal intelligence operations" and says nothing about federal agencies.'
- id: 2023-04-buncombe-county
  page: WNC/Buncombe County/index
  order: 30
  area:
  - Buncombe County
  date: 2023-04
  date_label: April 2023
  kind: built
  title: Buncombe sheriff's plan uses Fusus cameras to monitor downtown Asheville
  same_as: 2023-04-asheville
  summary: ' A seven-page plan obtained by Asheville Watchdog has deputies using the Fusus network to "monitor downtown business district for safety and security purposes" and "advise assigned personnel of any suspicious or criminal activity observed during monitoring." The idea came from commission Chair Newman, the same official who had questioned the program ten months earlier. (<a href="https://avlwatchdog.org/down-town-document-reveals-details-of-buncombe-plan-to-assist-asheville-police/">Asheville Watchdog</a>)'
- id: 2023-04-17-buncombe-county
  page: WNC/Buncombe County/index
  order: 31
  area:
  - Buncombe County
  date: '2023-04-17'
  date_label: April 17, 2023
  kind: built
  title: Buncombe sheriff's drone policy takes effect
  summary: ' Policy 403, revised August 15, 2026 to add a "Drone as First Responder" program.'
- id: 2023-05-25-buncombe-county
  page: WNC/Buncombe County/index
  order: 32
  area:
  - Buncombe County
  date: '2023-05-25'
  date_label: May 25, 2023
  kind: built
  title: Buncombe County gives the sheriff access to county building cameras, no board vote
  summary: ' The county''s Security Camera Policy is edited to allow "access to stored data by the Sheriff''s Office" and to let Sheriff''s Office investigations request footage outside the public records process. The policy''s own cover sheet: "Requires Board Approval: No." (<a href="https://www.buncombenc.gov/DocumentCenter/View/4743/Security-Camera-Policy-PDF">county policy PDF</a> · <a href="assets/bcso-policies/county-security-camera-policy.pdf">archived copy</a>)'
- id: 2023-09-buncombe-county
  page: WNC/Buncombe County/index
  order: 33
  area:
  - Buncombe County
  date: 2023-09
  date_label: September 2023
  kind: built
  title: Buncombe sheriff signs a $2.4 million Axon body and dash camera contract
  same_as: 2023-09-asheville
  summary: ' Five years, "just over $2.4 million," for body cameras and dash cameras that stream live into Fusus. Sheriff Miller: "Whenever our deputies are in the vicinity of APD officers, the system makes all the cameras come on." The same article counts 1,800 cameras on the network, "the vast majority" in county schools and Asheville Housing Authority properties, and <strong>fewer than 15 in private downtown businesses</strong>, which is the revenue base the enterprise fund was sold on. Whether the contract received its own commission vote is unestablished. (<a href="https://www.yahoo.com/news/buncombe-county-sheriff-gets-real-090507063.html">Citizen Times via Yahoo</a>) <a href="../Companies/What-Axon-Contracts-Do">What Axon Contracts Do</a>'
- id: 2025-04-09-buncombe-county
  page: WNC/Buncombe County/index
  order: 34
  area:
  - Buncombe County
  date: '2025-04-09'
  date_label: April 9, 2025
  kind: built
  title: Buncombe sheriff approves a written policy for the intelligence center
  same_as: 2025-04-09-asheville
  summary: ' (Policy 217, below), three years after the center opened.'
- id: 2026-03-buncombe-county
  page: WNC/Buncombe County/index
  order: 35
  area:
  - Buncombe County
  date: 2026-03
  date_label: March 2026
  kind: built
  title: Asheville housing authority report shows sheriff and city police access to its cameras
  summary: ' HACA''s executive report lists a "Surveillance Integration" task: updating passwords "for all users who access the camera DVRs, including BCSD and APD." Both agencies have standing access to the recorders at public housing. (<a href="https://haca.org/wp-content/uploads/2026/03/Executive-Report-03252026.pdf">HACA executive report, March 25, 2026</a> · <a href="assets/bcso-policies/haca-executive-report-2026-03-25.pdf">archived copy</a>) <a href="../WNC/Asheville/Tracking/Cameras-in-Public-Housing">Cameras in Public Housing</a>'
- id: 2026-06-buncombe-county
  page: WNC/Buncombe County/index
  order: 36
  area:
  - Buncombe County
  date: 2026-06
  date_label: June to July 2026
  kind: built
  title: Buncombe sheriff joins Asheville's private policy workgroup for the intelligence center
  summary: ' The sheriff floats evolving the center into "a regional RTIC" under a city-county agreement. <a href="../WNC/Asheville/Tracking/The-RTIC-Policy">The RTIC Policy</a>'
- id: 2026-11-03-buncombe-county
  page: WNC/Buncombe County/index
  order: 37
  area:
  - Buncombe County
  date: '2026-11-03'
  date_label: November 3, 2026
  kind: ahead
  now: true
  title: Buncombe voters choose a sheriff and two county commissioners
  summary: ' Sheriff <a href="../WNC/Buncombe-County/Officials/Quentin-Miller">Quentin Miller</a> vs <a href="../WNC/Buncombe-County/Officials/Gary-Parris">Gary Parris</a>; two commission seats contested; three school-board seats. <a href="../Act/Election-2026">Election 2026</a>'
- id: 2024-haywood-county
  page: WNC/Haywood County/index
  order: 24
  area:
  - Haywood County
  date: '2024'
  date_label: '2024'
  kind: built
  title: Haywood sheriff puts 8 to 10 Flock cameras into use, no vote
  summary: ' The Sheriff''s Office puts <strong>~8–10 Flock cameras</strong> into use; like <a href="./WNC/Madison-County/index">Madison County</a>, they enter through the sheriff''s operations with no formal deployment vote. <a href="../Act/Getting-Flock-Out">Getting Flock Out</a>'
- id: undated-haywood-county
  page: WNC/Haywood County/index
  order: 25
  area:
  - Haywood County
  date: 2025-07
  date_label: FY26 budget
  kind: built
  title: Maggie Valley police buy two plate readers with drug-seizure money
  summary: ' $7,300 the first year, $6,000/year after, paid from the drug-seizure account, with access to state and national LPR databases. A budget-retreat consensus, not a public-hearing item (<a href="https://www.yahoo.com/news/articles/upgrading-maggie-police-vehicles-license-232300971.html">The Mountaineer</a>).'
- id: 2026-03-03-haywood-county
  page: WNC/Haywood County/index
  order: 26
  area:
  - Haywood County
  date: '2026-03-03'
  date_label: March 3, 2026
  kind: none
  title: Haywood sheriff loses the Republican primary
  summary: ' Republican challenger <strong>Mark Mease</strong> defeats incumbent Sheriff Bill Wilke (about 58%); Mease faces Democrat <strong>Tyler Howell</strong>, a Waynesville police officer, on November 3 (<a href="https://ballotpedia.org/Haywood_County,_North_Carolina,_elections,_2026">Ballotpedia</a>). No public position on the cameras found for either as of Sept 8, 2026.'
- id: 2026-07-haywood-county
  page: WNC/Haywood County/index
  order: 27
  area:
  - Haywood County
  date: 2026-07
  date_label: July 2026
  kind: built
