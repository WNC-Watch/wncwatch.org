  date: '2026-08-20'
  date_label: August 20, 2026
  kind: changed
  title: Records requests release four drafts of Asheville's intelligence center policy
  full: 'Seven records land via two public records requests shared by [[Get Involved|Sunshine Labs]]'' Patrick Conant: four drafts of Policy 1703 (facial recognition ban included, but only from the third draft on; a remote-access ban and per-shift hotlist review deleted along the way), the private policy workgroup''s meeting notes, and Axon emails showing the contract went for signature **July 16**, a never-announced second contract for **20 in-car plate readers**, and the city''s opt-out from Axon''s default data program. The full analysis: [[The RTIC Policy]].'
- id: 2026-08-21-asheville
  page: WNC/Asheville/Timeline
