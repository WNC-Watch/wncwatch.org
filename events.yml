  area:
  - Transylvania County
  date: '2026-09-08'
  date_label: Sept 8, 2026
  kind: changed
  title: Brevard police chief withdraws the request for 3 Axon plate readers
  summary: ' At the start of the council meeting, Police Chief Christy Wentzell withdrew the department''s request for the three plate readers: "We asked for the community''s voice and they gave it to us." She told council: "my belief in the value of the technology has not changed. But what has changed is my belief in that this is the right time for Brevard to move forward with it," and "We will continue moving forward with the tasers and the bodyworn cameras, but not the ALPR portion." Council then voted 3 to 2 to approve a modified agenda without the item. The cameras had been offered at no charge inside the taser and body-camera purchase, which remains pending (<a href="https://www.transylvaniatimes.com/news/police-chief-cancels-camera-plan/article_5515e786-0bdd-4c13-af0c-f9fcc4041b33.html">Transylvania Times</a>, Sept 8). (<a href="https://www.youtube.com/watch?v=BHIQQfdGmZ4">city recording</a>, 0:05:50 to 0:11:17).'
