  title: Brevard police hold a public session on the Axon plate-reader offer
  summary: ' Brevard PD and city staff took questions at the Mary C. Jenkins Community Center, the session the Public Safety Committee recommended in July with council members Dean Lytle ("hot button") and Aaron Baker pushing for it. The city has since posted <a href="https://www.cityofbrevard.com/DocumentCenter/View/6478">its audio recording</a> and <a href="https://www.cityofbrevard.com/DocumentCenter/View/6477">the chief''s slides</a>. On the recording the chief said Axon "cannot sell the data," that "automatic sharing is not enabled," that sharing with another agency is "theoretically, yes ... case-by-case," and that the cameras "have those capabilities" for live video to a command center; City Attorney Mac McKellar said the courts have found the cameras legal in criminal cases "but every case that I read also has a further warning ... they could become more pervasive" (0:05:12 to 1:31:11).'
- id: 2026-09-08-transylvania-county
