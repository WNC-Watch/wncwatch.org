  title: Flock and Axon questions reach boards in four WNC counties
  full: 'Henderson County''s removal campaign passes 1,000 petition signatures and [[Lowell Griffin|Sheriff Griffin]] publishes a written defense with checkable claims; Brevard schedules a Sept 1 public session on Axon''s offer of three free fixed plate readers; Jackson County commissioners hear the sheriff''s numbers (1.19 million reads a month from four cameras) while the Sylva Herald''s records requests go unanswered; and App State, after finding its cameras were searched 1.5 million times in three months, mostly from out of state, cuts national network access while Boone PD cuts sharing to 41 agencies. County pages: [[WNC/Henderson County/index|Henderson County]] · [[WNC/Transylvania County/index|Transylvania County]] · [[WNC/Jackson County/index|Jackson County]] · [[WNC/Watauga County/index|Watauga County]].'
